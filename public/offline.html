<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Sem ligação · Família</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--t:#000;--d:rgba(60,60,67,.76);--a:#007aff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--t:#fff;--d:rgba(235,235,245,.6);--a:#0a84ff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));box-sizing:border-box;text-align:center}
.c{background:var(--card);border-radius:20px;padding:28px 22px;max-width:340px}
h1{font-size:22px;margin:8px 0}p{color:var(--d);margin:0 0 18px}
button{font:inherit;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:12px;padding:12px 22px;min-height:44px}
button:active{transform:scale(.97);opacity:.85}
</style></head>
<body><main><div class="c"><div style="font-size:44px" aria-hidden="true">📡</div>
<h1>Sem ligação</h1><p>A app ainda não ficou guardada neste aparelho. Liga-te uma vez à rede e depois passa a abrir mesmo offline.</p>
<button onclick="location.reload()">Tentar de novo</button></div></main>
<script>addEventListener('online',function(){location.reload()})</script></body></html>
